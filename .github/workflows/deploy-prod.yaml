name: Build & Deploy Prod

on:
    push:
        branches: [release]

jobs:
    build_and_push:
        runs-on: ubuntu-latest
        env:
            IMAGE_NAME: ghcr.io/lycoon/scriptio-app
        steps:
            - name: Checkout the repo
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Set environment variables
              run: |
                  echo "APP_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
                  echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ env.IMAGE_NAME }}:latest
                      ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
                  build-args: |
                      NEXT_PUBLIC_API_URL=https://scriptio.app
                      NEXT_PUBLIC_COMMIT_SHA=${{ env.COMMIT_SHA }}
                      NEXT_PUBLIC_APP_VERSION=${{ env.APP_VERSION }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        runs-on: ubuntu-latest
        needs: build_and_push
        steps:
            - name: Checkout repo
              uses: actions/checkout@v6

            - name: Copy docker-compose to VPS
              uses: appleboy/scp-action@master
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_SECRET }}
                  port: ${{ secrets.SSH_PORT }}
                  source: docker-compose.yml
                  target: ${{ secrets.APP_PATH }}

            - name: Deploy via SSH
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_SECRET }}
                  port: ${{ secrets.SSH_PORT }}
                  script: |
                      cd ${{ secrets.APP_PATH }}
                      docker compose pull app-prod
                      docker compose --env-file .env.prod --profile prod up -d
