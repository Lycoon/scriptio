name: Deploy Staging

on:
    push:
        branches: [staging]
        # Homepage-only changes deploy via deploy-landing-staging.yaml and must
        # not trigger the app image rebuild + desktop publish pipeline.
        paths-ignore:
            - "landing/**"

permissions:
    contents: read
    packages: write

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            short_version: ${{ steps.version.outputs.short_version }}
            revision: ${{ steps.version.outputs.revision }}
            commit_sha: ${{ steps.version.outputs.commit_sha }}
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Compute version
              id: version
              uses: ./.github/actions/compute-version

    publish-macos:
        runs-on: macos-latest
        needs: [prepare]
        env:
            APP_PATH: src-tauri/target/universal-apple-darwin/debug/bundle/macos/Scriptio (Staging).app
            PKG_PATH: Scriptio.pkg
        steps:
            - uses: actions/checkout@v6

            - name: Import Apple certificates
              uses: apple-actions/import-codesign-certs@v6
              with:
                  p12-file-base64: ${{ secrets.APPLE_CERT_P12_COMBINED_BASE64 }}
                  p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}

            - name: Download provisioning profile
              uses: apple-actions/download-provisioning-profiles@v6
              with:
                  bundle-id: "app.scriptio.staging"
                  profile-type: "MAC_APP_STORE"
                  issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
                  api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
                  api-private-key: ${{ secrets.APPSTORE_API_KEY_P8 }}

            - name: Copy provisioning profile to known path
              run: |
                  PROFILE=$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.provisionprofile \
                             2>/dev/null | head -n 1)
                  cp "$PROFILE" src-tauri/embedded.provisionprofile

            - name: Setup desktop build toolchain
              uses: ./.github/actions/setup-desktop-build
              with:
                  platform: macos

            - name: Apply app version
              uses: ./.github/actions/apply-version
              with:
                  version: ${{ needs.prepare.outputs.version }}
                  staging: "true"

            - name: Build and sign .app with Tauri
              run: npm run tauri build -- --debug --bundles app --target universal-apple-darwin --config src-tauri/tauri.appstore.conf.json --config "{\"bundle\":{\"macOS\":{\"bundleVersion\":\"${{ needs.prepare.outputs.revision }}\"}}}"
              env:
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  NEXT_PUBLIC_API_URL: https://staging.scriptio.app
                  NEXT_PUBLIC_CLOUD_URL: https://cloud.staging.scriptio.app
                  NEXT_PUBLIC_APP_VERSION: ${{ needs.prepare.outputs.version }}
                  NEXT_PUBLIC_COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}

            - name: Build signed .pkg installer
              run: |
                  xcrun productbuild \
                    --component "$APP_PATH" /Applications \
                    --sign "${{ secrets.APPLE_INSTALLER_IDENTITY }}" \
                    "$PKG_PATH"

            - name: Upload to App Store Connect
              uses: apple-actions/upload-testflight-build@v5
              with:
                  app-path: ${{ env.PKG_PATH }}
                  issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
                  api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
                  api-private-key: ${{ secrets.APPSTORE_API_KEY_P8 }}
                  backend: "altool"
                  app-type: "macos"

    publish-ios:
        runs-on: macos-latest
        needs: [prepare]
        steps:
            - uses: actions/checkout@v6

            - name: Import Apple certificates
              uses: apple-actions/import-codesign-certs@v6
              with:
                  p12-file-base64: ${{ secrets.APPLE_CERT_P12_COMBINED_BASE64 }}
                  p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}

            - name: Download provisioning profile
              uses: apple-actions/download-provisioning-profiles@v6
              with:
                  bundle-id: "app.scriptio.staging"
                  profile-type: "IOS_APP_STORE"
                  issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
                  api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
                  api-private-key: ${{ secrets.APPSTORE_API_KEY_P8 }}

            # xcodebuild -exportArchive defaults to Apple's "Cloud managed
            # signing" when no signing style is pinned, which asks the App
            # Store Connect API to select/manage the profile itself — that
            # needs an Admin-level API key and fails otherwise ("Cloud signing
            # permission error"). Sidestep it entirely by pointing the export
            # at the profile we already downloaded above (manual signing).
            - name: Configure export signing
              run: |
                  PROFILE=$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null | head -n 1)
                  if [[ -z "$PROFILE" ]]; then
                      echo "No iOS provisioning profile was installed" >&2
                      exit 1
                  fi
                  security cms -D -i "$PROFILE" -o "$RUNNER_TEMP/pp.plist"
                  NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/pp.plist")
                  echo "Using provisioning profile: $NAME"

                  EXPORT_PLIST="src-tauri/gen/apple/ExportOptions.plist"
                  PB="/usr/libexec/PlistBuddy"
                  # Delete+Add pairs so re-running (or a pre-existing key) doesn't
                  # abort the Add — each Delete is best-effort on its own.
                  $PB -c "Delete :signingStyle" "$EXPORT_PLIST" 2>/dev/null || true
                  $PB -c "Add :signingStyle string manual" "$EXPORT_PLIST"
                  $PB -c "Delete :teamID" "$EXPORT_PLIST" 2>/dev/null || true
                  $PB -c "Add :teamID string G93CJ6PWZH" "$EXPORT_PLIST"
                  $PB -c "Delete :signingCertificate" "$EXPORT_PLIST" 2>/dev/null || true
                  $PB -c "Add :signingCertificate string Apple Distribution" "$EXPORT_PLIST"
                  $PB -c "Delete :provisioningProfiles" "$EXPORT_PLIST" 2>/dev/null || true
                  $PB -c "Add :provisioningProfiles dict" "$EXPORT_PLIST"
                  $PB -c "Add :provisioningProfiles:app.scriptio.staging string $NAME" "$EXPORT_PLIST"
                  cat "$EXPORT_PLIST"

            # Give xcodebuild an App Store Connect API key so its automatic
            # signing (-allowProvisioningUpdates, which Tauri passes) can
            # authenticate non-interactively. Without it, CI has no Apple account
            # and fails with "No Accounts". Tauri forwards APPLE_API_* to
            # xcodebuild as -authenticationKey{ID,IssuerID,Path}.
            - name: Prepare App Store Connect API key
              env:
                  APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
              run: |
                  KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
                  printf '%s' "$APPSTORE_API_KEY_P8" > "$KEY_PATH"
                  echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

            - name: Setup build toolchain
              uses: ./.github/actions/setup-desktop-build
              with:
                  platform: ios

            - name: Apply app version
              uses: ./.github/actions/apply-version
              with:
                  version: ${{ needs.prepare.outputs.version }}
                  staging: "true"
                  ios: "true"

            - name: Build signed .ipa with Tauri
              run: npm run build:ios
              env:
                  APPLE_API_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
                  APPLE_API_KEY: ${{ secrets.APPSTORE_KEY_ID }}
                  APPLE_DEVELOPMENT_TEAM: G93CJ6PWZH
                  NEXT_PUBLIC_API_URL: https://staging.scriptio.app
                  NEXT_PUBLIC_CLOUD_URL: https://cloud.staging.scriptio.app
                  NEXT_PUBLIC_APP_VERSION: ${{ needs.prepare.outputs.version }}
                  NEXT_PUBLIC_COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}

            - name: Locate built .ipa
              run: |
                  IPA=$(find src-tauri/gen/apple/build -name '*.ipa' 2>/dev/null | head -n 1)
                  if [[ -z "$IPA" ]]; then
                      echo "No .ipa produced by tauri ios build" >&2
                      exit 1
                  fi
                  echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

            - name: Upload to App Store Connect
              uses: apple-actions/upload-testflight-build@v5
              with:
                  app-path: ${{ env.IPA_PATH }}
                  issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
                  api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
                  api-private-key: ${{ secrets.APPSTORE_API_KEY_P8 }}
                  backend: "appstore-api"
                  app-type: "ios"

    publish-android:
        runs-on: ubuntu-latest
        needs: [prepare]
        steps:
            - uses: actions/checkout@v6

            - name: Setup Android build toolchain
              uses: ./.github/actions/setup-desktop-build
              with:
                  platform: android

            - name: Apply app version
              uses: ./.github/actions/apply-version
              with:
                  version: ${{ needs.prepare.outputs.version }}
                  staging: "true"
                  android: "true"

            # The committed launcher icons are the release set, so re-render them
            # from the staging app-icon.png apply-version just swapped in.
            - name: Apply staging launcher icons
              run: npm run android:icons

            # Read by the signingConfig committed in gen/android/app/build.gradle.kts.
            # Both fields use the store password: the schema has a single
            # `password`, and PKCS12 keystores (what keytool now produces by
            # default) require the key and store passwords to match anyway.
            - name: Configure Android signing
              env:
                  GOOGLE_KEYSTORE_BASE64: ${{ secrets.GOOGLE_KEYSTORE_BASE64 }}
                  GOOGLE_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_KEYSTORE_PASSWORD }}
                  GOOGLE_KEY_ALIAS: ${{ secrets.GOOGLE_KEY_ALIAS }}
              run: |
                  set -e
                  base64 -d <<< "$GOOGLE_KEYSTORE_BASE64" > "$RUNNER_TEMP/keystore.jks"
                  {
                      echo "keyAlias=$GOOGLE_KEY_ALIAS"
                      echo "password=$GOOGLE_KEYSTORE_PASSWORD"
                      echo "storeFile=$RUNNER_TEMP/keystore.jks"
                  } > src-tauri/gen/android/keystore.properties

            # Play refuses artifacts built with android:debuggable, so staging
            # publishes a release-profile build as well. It is distinguished from
            # production by applicationId, launcher label, icon set and
            # versionCode — not by build profile like the desktop staging jobs.
            - name: Build AAB
              run: npm run build:android
              env:
                  NEXT_PUBLIC_API_URL: https://staging.scriptio.app
                  NEXT_PUBLIC_CLOUD_URL: https://cloud.staging.scriptio.app
                  NEXT_PUBLIC_APP_VERSION: ${{ needs.prepare.outputs.version }}
                  NEXT_PUBLIC_COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}

            - name: Locate built .aab
              run: |
                  set -e
                  # Scoped to outputs/: Gradle also leaves an unsigned
                  # intermediates/intermediary_bundle/**/intermediary-bundle.aab,
                  # which a bare -name '*.aab' finds first.
                  AAB=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' 2>/dev/null | head -n 1)
                  if [[ -z "$AAB" ]]; then
                      echo "No .aab produced by tauri android build" >&2
                      exit 1
                  fi
                  echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"
                  # R8 runs on the release profile, so upload the mapping with the
                  # bundle to get readable stack traces in Play Console. Optional:
                  # an empty value makes the upload action skip it.
                  MAPPING=$(find src-tauri/gen/android/app/build/outputs/mapping -name 'mapping.txt' 2>/dev/null | head -n 1 || true)
                  echo "MAPPING_PATH=$MAPPING" >> "$GITHUB_ENV"

            - name: Publish to Google Play (closed testing)
              uses: r0adkll/upload-google-play@v1
              with:
                  serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
                  packageName: app.scriptio.staging
                  releaseFiles: ${{ env.AAB_PATH }}
                  mappingFile: ${{ env.MAPPING_PATH }}
                  track: alpha
                  status: completed

    publish-windows:
        runs-on: windows-latest
        needs: [prepare]
        env:
            APP_PATH: src-tauri/target/msix/Scriptio_${{ needs.prepare.outputs.version }}.msixbundle
        steps:
            - uses: actions/checkout@v6

            - name: Setup desktop build toolchain
              uses: ./.github/actions/setup-desktop-build
              with:
                  platform: windows

            - name: Apply app version
              uses: ./.github/actions/apply-version
              with:
                  version: ${{ needs.prepare.outputs.version }}
                  staging: "true"

            - name: Build MSIX bundle
              run: npm run debug:windows
              env:
                  NEXT_PUBLIC_API_URL: https://staging.scriptio.app
                  NEXT_PUBLIC_CLOUD_URL: https://cloud.staging.scriptio.app
                  NEXT_PUBLIC_APP_VERSION: ${{ needs.prepare.outputs.version }}
                  NEXT_PUBLIC_COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}

            - name: Rename output to fixed name
              run: |
                  Get-Item "src-tauri/target/msix/*.msixbundle" | Rename-Item -NewName "Scriptio_${{ needs.prepare.outputs.version }}.msixbundle"

            - name: Verify MSIX package version
              run: |
                  $zip = "$env:APP_PATH"
                  Copy-Item $zip bundle.zip
                  Expand-Archive bundle.zip out -Force
                  $line = Select-String -Path out/AppxMetadata/AppxBundleManifest.xml -Pattern 'Version="([\d.]+)"' | Select-Object -First 1
                  $version = $line.Matches[0].Groups[1].Value
                  Write-Host "Built MSIX Identity Version: $version"
                  if ($version -notmatch '\.0$') {
                      throw "MSIX revision field must be 0 (got '$version'); the MS Store reserves the 4th component."
                  }

            - name: Configure Microsoft Store CLI
              uses: microsoft/microsoft-store-apppublisher@v1.1

            - name: Reconfigure store credentials
              run: msstore reconfigure `
                  --tenantId ${{ secrets.MS_TENANT_ID }} `
                  --sellerId ${{ secrets.MS_SELLER_ID }} `
                  --clientId ${{ secrets.MS_APP_ID }} `
                  --clientSecret ${{ secrets.MS_APP_SECRET }}

            - name: Publish to Microsoft Store (staging)
              run: msstore publish "$env:APP_PATH" -id "9P1N2HMSH40L"

    deploy-cloud:
        runs-on: ubuntu-latest
        needs: prepare
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: "25.2.1"
                  cache: "npm"

            - run: npm ci

            - name: Deploy Cloudflare Worker (staging)
              run: npm run cloud:deploy:staging
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    deploy-webapp:
        runs-on: ubuntu-latest
        needs: prepare
        env:
            IMAGE_NAME: ghcr.io/lycoon/scriptio-app
        steps:
            - uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Set commit SHA
              run: echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push staging image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ env.IMAGE_NAME }}:staging
                      ${{ env.IMAGE_NAME }}:staging-${{ needs.prepare.outputs.version }}
                  build-args: |
                      NEXT_PUBLIC_API_URL=https://staging.scriptio.app
                      NEXT_PUBLIC_CLOUD_URL=https://cloud.staging.scriptio.app
                      NEXT_PUBLIC_COMMIT_SHA=${{ env.COMMIT_SHA }}
                      NEXT_PUBLIC_APP_VERSION=${{ needs.prepare.outputs.version }}

            - name: Copy docker-compose and monitoring files to VPS
              uses: appleboy/scp-action@master
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_SECRET }}
                  port: ${{ secrets.SSH_PORT }}
                  source: "docker-compose.yml,monitoring/"
                  target: ${{ secrets.APP_PATH }}

            - name: Deploy via SSH
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_SECRET }}
                  port: ${{ secrets.SSH_PORT }}
                  script: |
                      set -e
                      docker image prune -af
                      cd ${{ secrets.APP_PATH }}
                      docker compose pull app-staging
                      docker compose --env-file .env.staging --profile staging up -d --force-recreate
