name: Deploy Staging

on:
    push:
        branches: [staging]

permissions:
    contents: read
    packages: write

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            short_version: ${{ steps.version.outputs.short_version }}
            revision: ${{ steps.version.outputs.revision }}
            commit_sha: ${{ steps.version.outputs.commit_sha }}
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Compute version
              id: version
              uses: ./.github/actions/compute-version

    publish-macos:
        runs-on: macos-latest
        needs: [prepare]
        env:
            APP_PATH: src-tauri/target/universal-apple-darwin/debug/bundle/macos/Scriptio (Staging).app
            PKG_PATH: Scriptio.pkg
        steps:
            - uses: actions/checkout@v6

            - name: Import Apple certificates
              uses: apple-actions/import-codesign-certs@v6
              with:
                  p12-file-base64: ${{ secrets.APPLE_CERT_P12_COMBINED_BASE64 }}
                  p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}

            - name: Download provisioning profile
              uses: apple-actions/download-provisioning-profiles@v6
              with:
                  bundle-id: "app.scriptio.staging"
                  profile-type: "MAC_APP_STORE"
                  issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
                  api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
                  api-private-key: ${{ secrets.APPSTORE_API_KEY_P8 }}

            - name: Copy provisioning profile to known path
              run: |
                  PROFILE=$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.provisionprofile \
                             2>/dev/null | head -n 1)
                  cp "$PROFILE" src-tauri/embedded.provisionprofile

            - name: Setup desktop build toolchain
              uses: ./.github/actions/setup-desktop-build
              with:
                  platform: macos

            - name: Apply app version
              uses: ./.github/actions/apply-version
              with:
                  version: ${{ needs.prepare.outputs.version }}
                  staging: "true"

            - name: Build and sign .app with Tauri
              run: npm run tauri build -- --debug --bundles app --target universal-apple-darwin --config src-tauri/tauri.appstore.conf.json --config "{\"bundle\":{\"macOS\":{\"bundleVersion\":\"${{ needs.prepare.outputs.revision }}\"}}}"
              env:
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  NEXT_PUBLIC_API_URL: https://staging.scriptio.app
                  NEXT_PUBLIC_CLOUD_URL: https://cloud.staging.scriptio.app
                  NEXT_PUBLIC_APP_VERSION: ${{ needs.prepare.outputs.version }}
                  NEXT_PUBLIC_COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}

            - name: Build signed .pkg installer
              run: |
                  xcrun productbuild \
                    --component "$APP_PATH" /Applications \
                    --sign "${{ secrets.APPLE_INSTALLER_IDENTITY }}" \
                    "$PKG_PATH"

            - name: Upload to App Store Connect
              uses: apple-actions/upload-testflight-build@v5
              with:
                  app-path: ${{ env.PKG_PATH }}
                  issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
                  api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
                  api-private-key: ${{ secrets.APPSTORE_API_KEY_P8 }}
                  backend: "altool"
                  app-type: "macos"

    publish-ios:
        runs-on: macos-latest
        needs: [prepare]
        steps:
            - uses: actions/checkout@v6

            - name: Import Apple certificates
              uses: apple-actions/import-codesign-certs@v6
              with:
                  p12-file-base64: ${{ secrets.APPLE_CERT_P12_COMBINED_BASE64 }}
                  p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}

            - name: Download provisioning profile
              uses: apple-actions/download-provisioning-profiles@v6
              with:
                  bundle-id: "app.scriptio.staging"
                  profile-type: "IOS_APP_STORE"
                  issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
                  api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
                  api-private-key: ${{ secrets.APPSTORE_API_KEY_P8 }}

            - name: Setup build toolchain
              uses: ./.github/actions/setup-desktop-build
              with:
                  platform: ios

            - name: Apply app version
              uses: ./.github/actions/apply-version
              with:
                  version: ${{ needs.prepare.outputs.version }}
                  staging: "true"
                  ios: "true"

            - name: Build signed .ipa with Tauri
              run: npm run build:ios
              env:
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  NEXT_PUBLIC_API_URL: https://staging.scriptio.app
                  NEXT_PUBLIC_CLOUD_URL: https://cloud.staging.scriptio.app
                  NEXT_PUBLIC_APP_VERSION: ${{ needs.prepare.outputs.version }}
                  NEXT_PUBLIC_COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}

            - name: Locate built .ipa
              run: |
                  IPA=$(find src-tauri/gen/apple/build -name '*.ipa' 2>/dev/null | head -n 1)
                  if [[ -z "$IPA" ]]; then
                      echo "No .ipa produced by tauri ios build" >&2
                      exit 1
                  fi
                  echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

            - name: Upload to App Store Connect
              uses: apple-actions/upload-testflight-build@v5
              with:
                  app-path: ${{ env.IPA_PATH }}
                  issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
                  api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
                  api-private-key: ${{ secrets.APPSTORE_API_KEY_P8 }}
                  backend: "altool"
                  app-type: "ios"

    publish-windows:
        runs-on: windows-latest
        needs: [prepare]
        env:
            APP_PATH: src-tauri/target/msix/Scriptio_${{ needs.prepare.outputs.version }}.msixbundle
        steps:
            - uses: actions/checkout@v6

            - name: Setup desktop build toolchain
              uses: ./.github/actions/setup-desktop-build
              with:
                  platform: windows

            - name: Apply app version
              uses: ./.github/actions/apply-version
              with:
                  version: ${{ needs.prepare.outputs.version }}
                  staging: "true"

            - name: Build MSIX bundle
              run: npm run debug:windows
              env:
                  NEXT_PUBLIC_API_URL: https://staging.scriptio.app
                  NEXT_PUBLIC_CLOUD_URL: https://cloud.staging.scriptio.app
                  NEXT_PUBLIC_APP_VERSION: ${{ needs.prepare.outputs.version }}
                  NEXT_PUBLIC_COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}

            - name: Rename output to fixed name
              run: |
                  Get-Item "src-tauri/target/msix/*.msixbundle" | Rename-Item -NewName "Scriptio_${{ needs.prepare.outputs.version }}.msixbundle"

            - name: Verify MSIX package version
              run: |
                  $zip = "$env:APP_PATH"
                  Copy-Item $zip bundle.zip
                  Expand-Archive bundle.zip out -Force
                  $line = Select-String -Path out/AppxMetadata/AppxBundleManifest.xml -Pattern 'Version="([\d.]+)"' | Select-Object -First 1
                  $version = $line.Matches[0].Groups[1].Value
                  Write-Host "Built MSIX Identity Version: $version"
                  if ($version -notmatch '\.0$') {
                      throw "MSIX revision field must be 0 (got '$version'); the MS Store reserves the 4th component."
                  }

            - name: Configure Microsoft Store CLI
              uses: microsoft/microsoft-store-apppublisher@v1.1

            - name: Reconfigure store credentials
              run: msstore reconfigure `
                  --tenantId ${{ secrets.MS_TENANT_ID }} `
                  --sellerId ${{ secrets.MS_SELLER_ID }} `
                  --clientId ${{ secrets.MS_APP_ID }} `
                  --clientSecret ${{ secrets.MS_APP_SECRET }}

            - name: Publish to Microsoft Store (staging)
              run: msstore publish "$env:APP_PATH" -id "9P1N2HMSH40L"

    deploy-cloud:
        runs-on: ubuntu-latest
        needs: prepare
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: "25.2.1"
                  cache: "npm"

            - run: npm ci

            - name: Deploy Cloudflare Worker (staging)
              run: npm run cloud:deploy:staging
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    deploy-web:
        runs-on: ubuntu-latest
        needs: prepare
        env:
            IMAGE_NAME: ghcr.io/lycoon/scriptio-app
        steps:
            - uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Set commit SHA
              run: echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push staging image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ env.IMAGE_NAME }}:staging
                      ${{ env.IMAGE_NAME }}:staging-${{ needs.prepare.outputs.version }}
                  build-args: |
                      NEXT_PUBLIC_API_URL=https://staging.scriptio.app
                      NEXT_PUBLIC_CLOUD_URL=https://cloud.staging.scriptio.app
                      NEXT_PUBLIC_COMMIT_SHA=${{ env.COMMIT_SHA }}
                      NEXT_PUBLIC_APP_VERSION=${{ needs.prepare.outputs.version }}

            - name: Copy docker-compose and monitoring files to VPS
              uses: appleboy/scp-action@master
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_SECRET }}
                  port: ${{ secrets.SSH_PORT }}
                  source: "docker-compose.yml,monitoring/"
                  target: ${{ secrets.APP_PATH }}

            - name: Deploy via SSH
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_SECRET }}
                  port: ${{ secrets.SSH_PORT }}
                  script: |
                      set -e
                      docker image prune -af
                      cd ${{ secrets.APP_PATH }}
                      docker compose pull app-staging
                      docker compose --env-file .env.staging --profile staging up -d --force-recreate
