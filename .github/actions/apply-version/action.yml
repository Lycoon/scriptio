name: Apply App Version
description: Writes version into src-tauri/tauri.conf.json + Cargo.toml. Optionally sets window title to "Scriptio (Staging)".

inputs:
    version:
        description: Version string (e.g. 2.0.1.5) to write into Tauri + Cargo configs.
        required: true
    staging:
        description: When "true", sets window title to "Scriptio (Staging)".
        required: false
        default: "false"
    ios:
        description: When "true" (on a macOS runner), stamp product name, bundle id, and version into src-tauri/gen/apple.
        required: false
        default: "false"

runs:
    using: composite
    steps:
        - name: Apply version to Tauri and Cargo configs
          shell: bash
          env:
              INPUT_VERSION: ${{ inputs.version }}
              INPUT_STAGING: ${{ inputs.staging }}
          run: |
              set -e

              SEMVER=$(echo "$INPUT_VERSION" | cut -d. -f1-3)
              MAJOR=$(echo "$INPUT_VERSION" | cut -d. -f1)
              MINOR=$(echo "$INPUT_VERSION" | cut -d. -f2)
              PATCH=$(echo "$INPUT_VERSION" | cut -d. -f3)
              REVISION=$(echo "$INPUT_VERSION" | cut -d. -f4)

              if [[ "$INPUT_STAGING" == "true" ]]; then
                  PRODUCT_NAME="Scriptio (Staging)"
                  WINDOW_TITLE="Scriptio (Staging)"
                  APPSTORE_IDENTIFIER="app.scriptio.staging"
                  IOS_IDENTIFIER="app.scriptio.staging"
                  # tauri ios build writes this straight into pbxproj's PRODUCT_NAME
                  # (see synchronize_project_config in tauri-cli), which becomes the
                  # .app's actual executable filename — App Store Connect rejects
                  # parens/brackets/etc there, so it must stay identifier-safe unlike
                  # the desktop PRODUCT_NAME above.
                  IOS_PRODUCT_NAME="Scriptio_Staging"
                  WINDOWS_IDENTIFIER="ArkoLogic.ScriptioStaging"
                  # MS Store reserves the 4th version field (must stay 0). Staging's
                  # build counter (REVISION) sits in that slot, so fold PATCH+REVISION
                  # into the 3rd field to keep MSIX versions strictly increasing
                  # across staging pushes and release bumps.
                  MSIX_VERSION="${MAJOR}.${MINOR}.$(( PATCH * 10000 + REVISION )).0"
              else
                  PRODUCT_NAME="Scriptio"
                  WINDOW_TITLE="Scriptio"
                  APPSTORE_IDENTIFIER="app.scriptio"
                  IOS_IDENTIFIER="app.scriptio"
                  IOS_PRODUCT_NAME="Scriptio"
                  WINDOWS_IDENTIFIER="ArkoLogic.Scriptio"
                  # Release builds carry REVISION=0, so the app version is Store-legal as-is.
                  MSIX_VERSION="${MAJOR}.${MINOR}.${PATCH}.0"
              fi

              jq --arg v "$SEMVER" --arg t "$WINDOW_TITLE" --arg n "$PRODUCT_NAME" \
                  '.version = $v | .app.windows[0].title = $t | .productName = $n' \
                  src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
              mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

              jq --arg id "$APPSTORE_IDENTIFIER" '.identifier = $id' \
                  src-tauri/tauri.appstore.conf.json > src-tauri/tauri.appstore.conf.json.tmp
              mv src-tauri/tauri.appstore.conf.json.tmp src-tauri/tauri.appstore.conf.json

              jq --arg id "$IOS_IDENTIFIER" --arg n "$IOS_PRODUCT_NAME" \
                  '.identifier = $id | .productName = $n' \
                  src-tauri/tauri.ios.conf.json > src-tauri/tauri.ios.conf.json.tmp
              mv src-tauri/tauri.ios.conf.json.tmp src-tauri/tauri.ios.conf.json

              jq --arg id "$WINDOWS_IDENTIFIER" --arg v "$SEMVER" \
                  '.identifier = $id | .version = $v' \
                  src-tauri/tauri.windows.conf.json > src-tauri/tauri.windows.conf.json.tmp
              mv src-tauri/tauri.windows.conf.json.tmp src-tauri/tauri.windows.conf.json

              if [[ -f "src-tauri/gen/windows/bundle.config.json" ]]; then
                  jq --arg v "$MSIX_VERSION" '.version = $v' \
                      src-tauri/gen/windows/bundle.config.json > src-tauri/gen/windows/bundle.config.json.tmp
                  mv src-tauri/gen/windows/bundle.config.json.tmp src-tauri/gen/windows/bundle.config.json
              fi

              sed -i.bak "s/^version = \".*\"/version = \"$SEMVER\"/" src-tauri/Cargo.toml
              rm -f src-tauri/Cargo.toml.bak

              echo "Applied version $INPUT_VERSION (MSIX: $MSIX_VERSION, productName: '$PRODUCT_NAME', appstore: $APPSTORE_IDENTIFIER, windows: $WINDOWS_IDENTIFIER)"

        # macOS and Windows bundlers both read icons straight out of
        # src-tauri/icons at build time (tauri.conf.json's bundle.icon list,
        # and tauri-windows-bundle's hardcoded src-tauri/icons lookup), so
        # swapping the staging icon set in here — before those bundlers run —
        # is enough to make staging builds visually distinct from release on
        # a device that has both installed. Only touches the checkout for
        # this CI run, never committed.
        - name: Select app icon set
          shell: bash
          env:
              INPUT_STAGING: ${{ inputs.staging }}
          run: |
              set -e

              if [[ "$INPUT_STAGING" == "true" && -d "src-tauri/icons-staging" ]]; then
                  cp src-tauri/icons-staging/32x32.png src-tauri/icons-staging/64x64.png \
                      src-tauri/icons-staging/128x128.png "src-tauri/icons-staging/128x128@2x.png" \
                      src-tauri/icons-staging/icon.png src-tauri/icons-staging/icon.icns src-tauri/icons-staging/icon.ico \
                      src-tauri/icons-staging/Square*.png src-tauri/icons-staging/StoreLogo.png \
                      src-tauri/icons/
                  echo "Using staging icon set (src-tauri/icons-staging)"
              else
                  echo "Using release icon set (src-tauri/icons)"
              fi

        - name: Apply macOS-specific settings
          if: ${{ runner.os == 'macOS' }}
          shell: bash
          env:
              INPUT_STAGING: ${{ inputs.staging }}
          run: |
              set -e

              if [[ "$INPUT_STAGING" == "true" ]]; then
                  APPSTORE_IDENTIFIER="app.scriptio.staging"
              else
                  APPSTORE_IDENTIFIER="app.scriptio"
              fi

              TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :com.apple.developer.team-identifier" src-tauri/Entitlements.plist)
              /usr/libexec/PlistBuddy -c "Set :com.apple.application-identifier ${TEAM_ID}.${APPSTORE_IDENTIFIER}" src-tauri/Entitlements.plist

              echo "Applied macOS settings (app-id: ${TEAM_ID}.${APPSTORE_IDENTIFIER})"

        - name: Apply iOS settings
          if: ${{ runner.os == 'macOS' && inputs.ios == 'true' }}
          shell: bash
          env:
              INPUT_VERSION: ${{ inputs.version }}
              INPUT_STAGING: ${{ inputs.staging }}
          run: |
              set -e

              INFO_PLIST="src-tauri/gen/apple/Scriptio_iOS/Info.plist"
              if [[ ! -f "$INFO_PLIST" ]]; then
                  echo "No $INFO_PLIST found; run 'tauri ios init' and commit gen/apple." >&2
                  exit 1
              fi

              SEMVER=$(echo "$INPUT_VERSION" | cut -d. -f1-3)

              if [[ "$INPUT_STAGING" == "true" ]]; then
                  DISPLAY_NAME="Scriptio (Staging)"
              else
                  DISPLAY_NAME="Scriptio"
              fi

              # PRODUCT_NAME and PRODUCT_BUNDLE_IDENTIFIER (which Info.plist's
              # CFBundleExecutable/CFBundleIdentifier resolve from via
              # "$(EXECUTABLE_NAME)"/"$(PRODUCT_BUNDLE_IDENTIFIER)") are NOT set here.
              # `tauri ios build` overwrites both in project.pbxproj on every build,
              # straight from the merged tauri.conf.json + tauri.ios.conf.json
              # (synchronize_project_config in tauri-cli) — so those are set via
              # tauri.ios.conf.json's identifier/productName fields, patched in the
              # step above, not here. Editing pbxproj directly would just get
              # clobbered by that same build step.

              # Mirror version + display name into the real, committed Info.plist
              # (the file xcodebuild actually embeds). CFBundleDisplayName may not
              # exist yet on a fresh checkout, so Add first (ignoring failure if it's
              # already there) and Set to cover both cases.
              for plist in src-tauri/gen/apple/*/Info.plist; do
                  /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${SEMVER}" "$plist" || true
                  /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${INPUT_VERSION}" "$plist" || true
                  /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ${DISPLAY_NAME}" "$plist" 2>/dev/null || \
                      /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${DISPLAY_NAME}" "$plist" || true
              done

              # src-tauri/icons/ios (or icons-staging/ios) is never read by the
              # Xcode build directly — Assets.xcassets in gen/apple is a separate,
              # committed copy that only xcodegen/xcodebuild actually see. Keep
              # them in sync here so the right icon set (and any future icon
              # regeneration) reaches the shipped binary.
              IOS_ICON_SRC="src-tauri/icons/ios"
              if [[ "$INPUT_STAGING" == "true" && -d "src-tauri/icons-staging/ios" ]]; then
                  IOS_ICON_SRC="src-tauri/icons-staging/ios"
              fi
              cp "$IOS_ICON_SRC"/*.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/
              echo "Synced iOS app icons from $IOS_ICON_SRC"

              echo "Applied iOS settings (display: '$DISPLAY_NAME', short: $SEMVER, build: $INPUT_VERSION, icons: $IOS_ICON_SRC)"
