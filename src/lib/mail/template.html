<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <title>Scriptio email</title>
        <style>
            body {
                background-color: #f6f6f6;
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
                font-size: 16px;
                line-height: 1.5;
                margin: 0;
                padding: 0;
                -ms-text-size-adjust: 100%;
                -webkit-text-size-adjust: 100%;
            }

            img {
                border: none;
                -ms-interpolation-mode: bicubic;
                max-width: 100%;
            }

            table {
                border-collapse: separate;
                mso-table-lspace: 0pt;
                mso-table-rspace: 0pt;
            }

            @media only screen and (max-width: 620px) {
                .outer-table .container {
                    width: 100% !important;
                }
                .main-content {
                    padding: 24px 20px !important;
                }
                .btn-pill {
                    padding: 14px 30px !important;
                    width: 100% !important;
                    box-sizing: border-box !important;
                }
            }
        </style>
    </head>
    <body style="background-color: #f6f6f6; margin: 0; padding: 0">
        <table
            role="presentation"
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            class="outer-table"
            style="background-color: #f6f6f6; width: 100%"
        >
            <tr>
                <td align="center" style="padding: 40px 10px">
                    <table
                        role="presentation"
                        border="0"
                        cellpadding="0"
                        cellspacing="0"
                        width="600"
                        class="container"
                        style="margin: 0 auto; width: 600px; max-width: 600px"
                    >
                        <!-- MAIN CONTENT -->
                        <tr>
                            <td>
                                <table
                                    role="presentation"
                                    border="0"
                                    cellpadding="0"
                                    cellspacing="0"
                                    width="100%"
                                    style="
                                        background-color: #ffffff;
                                        border-radius: 8px;
                                        width: 100%;
                                    "
                                >
                                    <tr>
                                        <td
                                            class="main-content"
                                            style="padding: 40px 36px"
                                        >
                                            <h2
                                                style="
                                                    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                                                    font-size: 24px;
                                                    font-weight: 600;
                                                    color: #000000;
                                                    text-align: center;
                                                    margin: 0 0 24px 0;
                                                    letter-spacing: -0.3px;
                                                "
                                            >
                                                {{welcomeMessage}}
                                            </h2>
                                            <p
                                                style="
                                                    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                                                    font-size: 15px;
                                                    color: #444444;
                                                    line-height: 1.6;
                                                    margin: 0 0 28px 0;
                                                    text-align: center;
                                                "
                                            >
                                                {{bodyText}}
                                            </p>
                                            <!-- BUTTON -->
                                            <table
                                                role="presentation"
                                                border="0"
                                                cellpadding="0"
                                                cellspacing="0"
                                                width="100%"
                                                style="width: 100%"
                                            >
                                                <tr>
                                                    <td align="center" style="padding-bottom: 28px">
                                                        <a
                                                            href="{{link}}"
                                                            target="_blank"
                                                            class="btn-pill"
                                                            style="
                                                                display: inline-block;
                                                                background-color: #000000;
                                                                color: #ffffff;
                                                                font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                                                                font-size: 14px;
                                                                font-weight: 600;
                                                                text-decoration: none;
                                                                padding: 14px 36px;
                                                                border-radius: 50px;
                                                                letter-spacing: 0.3px;
                                                            "
                                                            >{{buttonText}}</a
                                                        >
                                                    </td>
                                                </tr>
                                            </table>
                                            <p
                                                style="
                                                    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                                                    font-size: 13px;
                                                    color: #999999;
                                                    text-align: center;
                                                    margin: 0;
                                                    line-height: 1.5;
                                                "
                                            >
                                                If you did not request anything from Scriptio, you can safely ignore
                                                this email.
                                            </p>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>

                        <!-- SIGNATURE / FOOTER -->
                        <tr>
                            <td align="center" style="padding-top: 24px">
                                {{{signature}}}
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
