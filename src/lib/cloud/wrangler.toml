# Global configuration
name = "scriptio-cloud"
main = "index.ts"
compatibility_date = "2025-12-08"
compatibility_flags = ["nodejs_compat"]

# Default Durable Object binding (used as a template)
[[durable_objects.bindings]]
name = "PROJECT_ROOM"
class_name = "ProjectRoom"

# Migrations are global to the script class
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProjectRoom"]

# --- Production ---
[env.production]
name = "scriptio-cloud"
routes = [
  { pattern = "cloud.scriptio.app", custom_domain = true }
]

[[env.production.r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "scriptio-snapshots"

# --- Staging ---
[env.staging]
name = "scriptio-cloud-staging"
routes = [
  { pattern = "cloud.staging.scriptio.app", custom_domain = true }
]

[[env.staging.r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "scriptio-snapshots-staging"