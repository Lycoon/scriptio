server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Never serve the whole app from here — only the three marketing routes and
    # the landing's own assets are routed to this container by Traefik.

    # Static assets emitted under the "/_site" assetPrefix live on disk at out/_next.
    location /_site/_next/ {
        alias /usr/share/nginx/html/_next/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Other /_site/* (public files: images, favicon) live at out/_site/*.
    location /_site/ {
        try_files $uri =404;
    }

    # Pages: exported as index.html / privacy.html / contact.html.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
